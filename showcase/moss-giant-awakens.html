<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苔の巨人 — The Moss Giant</title>
<style>
:root{--ink:#e9dfc6;--dim:#a99f8a;--bg:#050505}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Songti SC",serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg)}
canvas#screen{display:block;background:#000;cursor:pointer}
#card{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050505;transition:opacity 1.2s ease;z-index:5;text-align:center;padding:0 16px}
#card.hide{opacity:0;pointer-events:none}
#card h1{font-weight:400;letter-spacing:.5em;margin:0 0 .4em .5em;font-size:clamp(28px,6vw,64px)}
#card .sub{letter-spacing:.35em;color:var(--dim);font-size:clamp(11px,1.6vw,15px);margin-bottom:2.4em}
#bar{width:min(320px,70vw);height:1px;background:#2a2620;position:relative;overflow:hidden}
#bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--ink);transition:width .25s}
#msg{margin-top:1em;color:var(--dim);font-size:13px;letter-spacing:.2em;min-height:1.4em}
#play{margin-top:2em;background:none;border:1px solid #6d6555;color:var(--ink);font:inherit;letter-spacing:.4em;padding:.8em 2.2em .8em 2.6em;cursor:pointer;opacity:0;transition:opacity .6s, background .3s}
#play.on{opacity:1}#play:hover{background:#1a1712}
#hud{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:12px/1.4 ui-monospace,Menlo,monospace;color:#cfc4ab;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:4px;opacity:0;transition:opacity .4s;z-index:4;white-space:nowrap;pointer-events:none}
#hud.on{opacity:1}
</style>
</head>
<body>
<div id="stage"><canvas id="screen"></canvas></div>
<div id="card"><h1>苔の巨人</h1><div class="sub">THE MOSS GIANT AWAKENS</div><div id="bar"><i></i></div><div id="msg">背景美術を描いています…</div><button id="play">上映 ▶</button></div>
<div id="hud"></div>

  while (x > x0) { const w = lobe * Rr(.35, 1.9), hang = R() < .22 ? Rr(.8, 1.6) : Rr(.15, .55); for (let k = 0; k <= 7; k++) { const t = k / 7; const xx = x - w * t; pts.push(xx, fn(xx) + Math.pow(Math.sin(t * Math.PI), .8) * w * hang + Rr(-4, 4)); } x -= w * Rr(.7, 1); }
  return pts;
}
// low undergrowth band: bumpy top edge
function bushOutline(x0, x1, base, hMin, hMax, lobe = 50) {
  const pts = [x0, base + 40]; let x = x0; while (x < x1) { const w = lobe * Rr(.5, 1.5), h = Rr(hMin, hMax); for (let k = 0; k <= 5; k++) { const t = k / 5; pts.push(x + w * t, base - Math.sin(t * Math.PI) * h); } x += w; } pts.push(x1, base + 40); return pts;
}

// cumulus bank: puffs on a flat base, painted with round dabs toned by facing + height
function paintCumulus(g, cx, cy, w, h, cols, light = [.8, -.5], nPuff = 16) {
  const C = cols.map(hx); const P = [];
  for (let i = 0; i < nPuff; i++) { const u = (i / (nPuff - 1)) * 2 - 1; const hh = (1 - u * u) * .85 + .15; P.push([cx + u * w * .5 + Rr(-.04, .04) * w, cy - hh * h * Rr(.55, .95), h * Rr(.28, .5) * (0.6 + hh * .5)]); }
  for (let i = 0; i < 8; i++) P.push([cx + Rr(-.3, .3) * w, cy - h * Rr(.7, 1.05), h * Rr(.25, .42)]);
  P.sort((a, b) => b[2] - a[2]);
  for (const [px, py, pr] of P) {
    const n = Math.max(30, pr * pr / 60 | 0);
    for (let i = 0; i < n; i++) {
      const a = R() * TAU, d = Math.sqrt(R()); const x = px + Math.cos(a) * d * pr, y = Math.min(cy, py + Math.sin(a) * d * pr * .8);
      const f = (Math.cos(a) * light[0] + Math.sin(a) * light[1]) * d; const hgt = (cy - y) / (h * 1.2);
      const t = clamp(.25 + f * .4 + hgt * .45 + (R() - .5) * .12, 0, .999) * (C.length - 1); const k = t | 0;
      dab(g, x, y, pr * Rr(.12, .22), pr * Rr(.1, .18), R() * 3, css(vary(mixc(C[k], C[Math.min(C.length - 1, k + 1)], t - k), PRNG, 5)), Rr(.55, .9), .3);
    }
  }
  // flat shadowed base
  for (let i = 0; i < w / 6; i++) dab(g, cx + Rr(-.5, .5) * w * .9, cy - Rr(0, h * .12), Rr(14, 40), Rr(4, 9), 0, css(vary(C[0], PRNG, 5)), Rr(.4, .7), .2);
  g.globalAlpha = 1;
}

   7. ANIMATION — timing charts, key poses, the bird, FX

const EASE = {
  lin: t => t, in: t => t * t, out: t => 1 - (1 - t) * (1 - t), io: t => t < .5 ? 2 * t * t : 1 - 2 * (1 - t) * (1 - t),
  in3: t => t * t * t, out3: t => 1 - Math.pow(1 - t, 3), io3: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  // anime spacing: favour the extremes, few in-betweens in the middle
  slowIn: t => 1 - Math.pow(1 - t, 2.4), slowOut: t => Math.pow(t, 2.4), heavy: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 2.2) / 2,
};
function lerpObj(a, b, t) {
  if (typeof a === 'number') return a + (b - a) * t;
  if (Array.isArray(a)) return a.map((v, i) => lerpObj(v, b[i], t));
  const o = {}; for (const k in a) { if (b[k] === undefined) { o[k] = a[k]; continue; } o[k] = lerpObj(a[k], b[k], t); } for (const k in b) if (o[k] === undefined) o[k] = b[k]; return o;
}
// keys: [[time, value, easeIntoThisKey]]
function keyed(t, keys) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) { if (t <= keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1, e] = keys[i]; const u = (t - t0) / (t1 - t0); return lerpObj(v0, v1, (EASE[e || 'io'])(u)); } }

}

function drawingId(t, keys, step = 2) { for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) { const hold = JSON.stringify(keys[i - 1][1]) === JSON.stringify(keys[i][1]); return hold ? 1000 + i : Math.floor(t * FPS / step); } return 2000; }

// tiny flock bird silhouette, flap phase 0..3

  const T = clock();

  const f = Math.floor(T * FPS); if (f !== PLAY.lastF) { PLAY.lastF = f; frameAt(f / FPS); }
  requestAnimationFrame(tick);
}
function endCard() { const c = $('card'); c.querySelector('h1').textContent = '終'; c.querySelector('.sub').textContent = 'THE MOSS GIANT AWAKENS'; $('bar').style.display = 'none'; $('msg').textContent = ''; const b = $('play'); b.textContent = 'もう一度 ↺'; b.onclick = () => { c.classList.add('hide'); start(0); }; c.classList.remove('hide'); }
addEventListener('keydown', e => {
  if (!PLAY.started) return;
  if (e.code === 'Space') { e.preventDefault(); PLAY.on ? pause() : resume(); }
  else if (e.code === 'ArrowRight') stepF(e.shiftKey ? 24 : 1); else if (e.code === 'ArrowLeft') stepF(e.shiftKey ? -24 : -1);
  else if (e.code === 'KeyR') { PLAY.on = false; start(0); } else if (e.code === 'KeyM') audioMute(!SND.on);
});
canvas.addEventListener('click', () => { if (PLAY.started) PLAY.on ? pause() : resume(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
boot();
</script>
